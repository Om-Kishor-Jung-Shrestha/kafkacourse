# Minimal OTLP collector — receives traces from the backend (when
# OTEL_ENABLED=true) and logs them via the `debug` exporter. To forward
# traces into Grafana instead, add Tempo as a service and an `otlp/tempo`
# exporter here, then add Tempo as a Grafana datasource alongside
# Prometheus/Loki (see infra/grafana/provisioning/datasources/datasources.yml).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
