# ─────────────────────────────────────────────────────────────────────────
# Kong native configuration file — the single source of truth for both the
# gateway's own behavior AND the underlying Nginx/OpenResty engine it runs
# on. Kong's role is strictly the backend's API gateway (see
# declarative/kong.yml — only a `multihub-backend` service/route + a debug
# /dapr route are defined). Serving the frontend is a completely separate
# concern handled by its own dedicated Nginx container
# (infra/nginx/frontend.conf, service `frontend-nginx`) — this file's
# `nginx_http_*`/`nginx_proxy_*` tuning applies only to Kong's own
# API-gateway traffic.
# ─────────────────────────────────────────────────────────────────────────

# ── Core gateway mode ───────────────────────────────────────────────────
database = off
declarative_config = /kong/declarative/kong.yml

proxy_listen = 0.0.0.0:8000
admin_listen = 0.0.0.0:8001

proxy_access_log = /dev/stdout
proxy_error_log = /dev/stderr
admin_access_log = /dev/stdout
admin_error_log = /dev/stderr

# ── Global Nginx http{} block tuning (nginx_http_*) ────────────────────
# These become raw `<name> <value>;` directives inside Kong's generated
# http{} block — i.e. real Nginx performance/throughput tuning, not a Kong
# plugin.
nginx_http_client_max_body_size = 50m
nginx_http_client_body_buffer_size = 128k
nginx_http_client_header_buffer_size = 4k
nginx_http_large_client_header_buffers = 4 16k
nginx_http_gzip = on
nginx_http_gzip_comp_level = 5
nginx_http_gzip_min_length = 1024
nginx_http_gzip_types = text/plain application/json application/javascript text/css application/xml image/svg+xml
nginx_http_keepalive_timeout = 75s
nginx_http_keepalive_requests = 10000

# TLS tuning — inert until an `ssl` listener + certificate are added to
# `proxy_listen` (e.g. "0.0.0.0:8443 ssl"). Uses Kong's NATIVE ssl_* settings,
# NOT nginx_http_ssl_ciphers etc: Kong already emits its own `ssl_ciphers`
# (from ssl_cipher_suite) in the http{} block, so injecting a second one via
# nginx_http_ssl_ciphers makes Nginx fail with
# `"ssl_ciphers" directive is duplicate` and Kong never starts.
ssl_cipher_suite = intermediate
ssl_protocols = TLSv1.2 TLSv1.3
ssl_prefer_server_ciphers = on
ssl_session_timeout = 1d
ssl_session_cache_size = 10m

# Merge a hand-written Nginx snippet into Kong's generated http{} block —
# used for things declarative Kong config can't express, like a raw static
# file server that bypasses Kong's Lua/plugin pipeline entirely. This keeps
# "legacy"/advanced Nginx logic alongside Kong's dynamic plugin ecosystem
# without touching Kong's own source or build.
nginx_http_include = /kong/nginx/custom.conf

# ── Proxy server{} block tuning (nginx_proxy_*) — applies to the server
#    block that actually handles proxied client traffic ─────────────────
nginx_proxy_proxy_buffering = on
nginx_proxy_proxy_buffer_size = 16k
nginx_proxy_proxy_buffers = 4 16k
nginx_proxy_proxy_busy_buffers_size = 32k
nginx_proxy_proxy_connect_timeout = 10s
nginx_proxy_proxy_send_timeout = 60s
nginx_proxy_proxy_read_timeout = 60s
nginx_proxy_large_client_header_buffers = 4 16k
