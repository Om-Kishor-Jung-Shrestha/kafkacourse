# ─────────────────────────────────────────────────────────────────────────
# Included into Kong's generated nginx.conf `http{}` block via
# `nginx_http_include` in ../kong.conf. This is the "advanced requirement"
# escape hatch: a completely separate `server{}` block, hand-written in
# plain Nginx, living inside the same Nginx/OpenResty process Kong manages —
# for raw static content that should bypass Kong's Lua/plugin routing
# pipeline entirely for maximum throughput (no auth/rate-limit/CORS plugin
# overhead per request).
#
# In this project it serves course thumbnails/static assets dropped into
# infra/kong/static/ (mounted read-only into the Kong container at
# /kong/static). A real deployment would point `root` at wherever uploaded
# media actually lives (see backend RULE-12 storage strategy).
# ─────────────────────────────────────────────────────────────────────────

server {
    listen 0.0.0.0:8088;
    server_name static-assets;

    root /kong/static;
    autoindex off;

    location = /health {
        default_type text/plain;
        return 200 "kong-nginx-static-ok\n";
    }

    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Served-By "kong-embedded-nginx";
    }
}
