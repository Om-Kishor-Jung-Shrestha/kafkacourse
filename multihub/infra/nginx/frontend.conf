# Dedicated Nginx for the frontend ONLY — this container's one job is
# serving the Next.js app (reverse proxy + gzip + HMR websocket support in
# dev). It does not know about the backend or Kong at all; the frontend's
# own client-side code calls the API through Kong directly
# (NEXT_PUBLIC_API_URL), and Next.js's server-side rewrites also go through
# Kong (API_GATEWAY_URL) — see next.config.ts. Kong is a separate, distinct
# role: the backend's API gateway (infra/kong/), not a frontend proxy.
#
# Uses Docker's embedded DNS (127.0.0.11) with a `resolve`d variable
# instead of a static proxy_pass target, so this container doesn't fail to
# start if `frontend` hasn't finished starting yet.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s;
  proxy_connect_timeout 10s;
  proxy_read_timeout 60s;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/plain application/json application/javascript text/css application/xml image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    location / {
      set $frontend_upstream frontend:3000;
      proxy_pass http://$frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
