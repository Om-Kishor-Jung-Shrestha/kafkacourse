# Scraped by the `prometheus` container. Backend exposes GET /metrics
# (backend/src/metrics) instrumented with prom-client — request counts/
# durations, outbox publish counts, Dapr publish duration, recommendation
# compute duration, emails sent, plus default Node.js process metrics.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: multihub-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3001"]
        labels:
          service: multihub-backend

  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ["kong:8001"]
        labels:
          service: kong
